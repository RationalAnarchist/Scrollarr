apiVersion: v1
kind: ServiceAccount
metadata:
  name: scrollarr
  labels:
    app: scrollarr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scrollarr-updater
  labels:
    app: scrollarr
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["scrollarr"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scrollarr-updater-binding
  labels:
    app: scrollarr
subjects:
  - kind: ServiceAccount
    name: scrollarr
roleRef:
  kind: Role
  name: scrollarr-updater
  apiGroup: rbac.authorization.k8s.io
